[project]
name = "imsearch"
version = "0.1.0"
description = "Search your local iMessage history (~/Library/Messages/chat.db)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pytypedstream>=0.1.0",
    "rich>=13.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
imsearch = "imsearch.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
