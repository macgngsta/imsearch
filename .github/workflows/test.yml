name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise (Python + uv)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run setup

      - name: Run tests
        run: mise run test
